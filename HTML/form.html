<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Mt first 🥇 form 😁</h1>
        <form action="thanks.html" method="get">
            <fieldset>
            <legend><h3>Fill 😠 it !!!</h3></legend>

            <label for="name" >Name-</label>
            <input type="text" id="name" required><br><br>

            <label for="branch">Branch-</label>
            <input type="text" id="branch" required><br><br>

            <label for="number">Enrollment Number-</label>
            <input type="number" id="number" required><br><br>

            <label for="date">Select a Date-</label>
            <input type="date" id="date" required><br><br>

            <label for="file">Choose a file-</label>
            <input type="file" id="file" required><br><br>

            <label for="email">Enter your E-mail-</label>
            <input type="email" id="email" required><br><br>

            <label for="password">Enter your Password-</label>
            <input type="password" id="password" required><br><br>

            <label for="">Select your gender-</label>
            <input type="radio" name="gender" value="Male" required>Male
            <input type="radio" name="gender" value="Female">Female
            <input type="radio" name="gender" value="Banana">Banana <br><br>

            <label for="State">Select your State-</label>
            <select name="State" id="State">
                <option value="" selected disabled>Choose a State</option>
                <option value="Utter Pradesh">Utter Pradesh</option>
                <option value="Delhi">Delhi</option>
                <option value="Madhya Pradesh">Madhya Pradesh</option>
                <option value="Gujarat">Gujarat</option>
                <option value="Odisa">Odisa</option>
            </select><br><br>

            <label for="">Select your hobbies-</label>
            <input type="checkbox" name="hobbies" value="reading">Reading
            <input type="checkbox" name="hobbies" value="Singing">Singing
            <input type="checkbox" name="hobbies" value="Dancing">Dancing
            <input type="checkbox" name="hobbies" value="Gaming">Gaming
            <input type="checkbox" name="hobbies" value="🌽">🌽<br><br>


            <input type="Submit" value="Register">
            </fieldset>
        </form>
</body>
</html>
