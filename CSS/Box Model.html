<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
        .box1{
            border: 2px solid black;
            height: 300px;
            width: 300px;
            background-color: aqua;
            text-align: center;
            margin: auto;
            padding: 20px 10px 20px 10px;
            box-sizing: border-box;
        }
        div{
            display: inline-block;
        }
        .box2{
            border: 2px solid black;
            height: 300px;
            width: 300px;
            background-color: rgb(0, 149, 255);
            text-align: center;
            padding: 20px;
            box-sizing: content-box;
        }
    </style>
</head>
<body>
    <div class="box1">This is first my box</div>
    <div class="box2">This is my second box</div>
</body>
</html>
