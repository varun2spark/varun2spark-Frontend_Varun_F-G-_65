<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip</title>
    <style>
        body{
        height:100vh;
        width:100vw;
        display:flex;
        justify-content:center;
        align-items: center;
        }
        .tooltip{
            border:1px solid black;
            padding:10px;
            position:relative;
            cursor:pointer;

        }
        .tooltiptext{
            background-color: pink;
            position:absolute;
            bottom:110%;
            visibility: hidden;
            opacity: 0;
            transition: all 2s ease-in-out;

        }
        .tooltiptext::after{
            content: "";
            border:6px solid;
            border-color: black transparent transparent transparent;
            top: 100%;
            position:absolute;
            left:50%;
        }

        .tooltip:hover .tooltiptext{
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class = "tooltip">
        <span class="tooltiptext">This is very important text</span>
        <span>👉🏻 Hover over me 👈🏻</span>
    </div>
</body>
</html>
