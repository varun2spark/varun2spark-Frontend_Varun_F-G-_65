<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Property</title>
    <style>
        .container{
            border: 2px solid;
            height: 800px;
        }
        img{
            height: 150px;
            width: 150px;
        }
        #first{
            position: static;
            top: 50px;
        }
        #second{
            position: relative;
            top: 100px;
        }
        #third{
            position: absolute;
            top: 120px;
        }
        #fourth{
            position: fixed ;
            top: 50px;
        }
        #fifth{

        }
    </style>
</head>
<body>
    <div class = "container">
        <img src="images (1).jpg" alt="first" id="first">
        <img src="images (2).jpg" alt="second" id="second">
        <img src="images (3).jpg" alt="third" id="third">
        <img src="images.jpg" alt="fourth" id="fourth">
        <img src="images.png" alt="fifth" id="fifth">
    </div>
</body>
</html>
